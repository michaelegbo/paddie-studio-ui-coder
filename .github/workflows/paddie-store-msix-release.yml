name: paddie-store-msix-release

on:
  push:
    branches:
      - dev
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to package"
        required: true
        default: "dev"
        type: string
      version:
        description: "MSIX version, without leading v"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-store-msix:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID || secrets.AZURE_AD_TENANT_ID }}
      PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID || secrets.SELLER_ID }}
      PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID || secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET || secrets.AZURE_AD_APPLICATION_SECRET }}
      MICROSOFT_STORE_PRODUCT_ID: ${{ secrets.PARTNER_CENTER_PRODUCT_ID || secrets.MICROSOFT_STORE_PRODUCT_ID }}
      MSIX_PACKAGE_IDENTITY_NAME: ${{ secrets.MSIX_PACKAGE_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Validate dev release source
        shell: pwsh
        run: |
          git fetch origin dev
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.ref }}" -ne "dev") {
            throw "Manual Microsoft Store publishing must use the dev branch."
          }
          git merge-base --is-ancestor HEAD origin/dev
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store publishing must use a commit reachable from origin/dev."
          }

      - uses: ./.github/actions/setup-bun

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          $requestedVersion = if ($eventName -eq "release") {
            "${{ github.event.release.tag_name }}".TrimStart("v")
          } elseif ($eventName -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            ((Get-Content -Raw -LiteralPath "packages/desktop/package.json" | ConvertFrom-Json).version -replace '[+-].*$', '')
          }
          if ($requestedVersion -notmatch '^(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?(?:[.-].*)?$') {
            throw "Version '$requestedVersion' must start with major.minor.patch"
          }
          $desktopVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          $msixVersion = "$desktopVersion.0"
          "version=$desktopVersion" >> $env:GITHUB_OUTPUT
          "msix_version=$msixVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Desktop version: $desktopVersion"
          Write-Host "MSIX package version: $msixVersion"

      - name: Validate Store secrets
        shell: pwsh
        run: |
          function Require-TrimmedEnv([string]$Name) {
            $value = [Environment]::GetEnvironmentVariable($Name)
            if (-not $value) {
              throw "$Name is required for Microsoft Store publishing"
            }
            $trimmed = $value.Trim().Trim([char]0xFEFF)
            if (-not $trimmed) {
              throw "$Name is required for Microsoft Store publishing"
            }
            "$Name=$trimmed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            return $trimmed
          }

          $tenantId = Require-TrimmedEnv "PARTNER_CENTER_TENANT_ID"
          $clientId = Require-TrimmedEnv "PARTNER_CENTER_CLIENT_ID"
          $ignoredGuid = [Guid]::Empty
          if (-not [Guid]::TryParse($tenantId, [ref]$ignoredGuid)) {
            throw "PARTNER_CENTER_TENANT_ID must be a GUID"
          }
          if (-not [Guid]::TryParse($clientId, [ref]$ignoredGuid)) {
            throw "PARTNER_CENTER_CLIENT_ID must be a GUID"
          }

          @(
            "PARTNER_CENTER_SELLER_ID",
            "PARTNER_CENTER_CLIENT_SECRET",
            "MICROSOFT_STORE_PRODUCT_ID",
            "MSIX_PACKAGE_IDENTITY_NAME",
            "MSIX_PUBLISHER",
            "MSIX_PUBLISHER_DISPLAY_NAME"
          ) | ForEach-Object {
            Require-TrimmedEnv $_ | Out-Null
          }

      - name: Set desktop version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $packagePath = "packages/desktop/package.json"
          $package = Get-Content -Raw -LiteralPath $packagePath | ConvertFrom-Json
          $package.version = $version
          $package | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $packagePath

          $cargoPath = "packages/desktop/src-tauri/Cargo.toml"
          $cargo = Get-Content -Raw -LiteralPath $cargoPath
          $cargo = $cargo -replace '(?m)^version = "[^"]+"', "version = `"$version`""
          Set-Content -LiteralPath $cargoPath -Value $cargo

          Push-Location packages/desktop/src-tauri
          cargo update -p opencode-desktop
          Pop-Location

      - name: Reinstall dependencies for Bun compile
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath packages -Directory | ForEach-Object {
            Remove-Item -Recurse -Force (Join-Path $_.FullName "node_modules") -ErrorAction SilentlyContinue
          }
          bun install

      - name: Build sidecar CLI
        shell: pwsh
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun ./packages/opencode/script/build.ts --single --baseline
          New-Item -ItemType Directory -Force -Path packages/desktop/src-tauri/sidecars | Out-Null
          $binary = Get-ChildItem -LiteralPath packages/opencode/dist -Recurse -Filter opencode.exe |
            Where-Object { $_.FullName -match "opencode-windows-x64" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $binary) {
            throw "No Windows opencode.exe sidecar was produced"
          }
          Copy-Item `
            -LiteralPath $binary.FullName `
            -Destination packages/desktop/src-tauri/sidecars/opencode-cli-x86_64-pc-windows-msvc.exe `
            -Force

      - name: Build Tauri executable
        shell: pwsh
        env:
          RUST_TARGET: x86_64-pc-windows-msvc
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
          OPENCODE_CHANNEL: prod
          VITE_OPENCODE_CHANNEL: prod
        run: |
          bun run --cwd packages/desktop tauri build --target x86_64-pc-windows-msvc --no-bundle --config src-tauri/tauri.prod.conf.json

      - name: Package MSIX
        id: package
        shell: pwsh
        run: |
          ./packages/desktop/scripts/package-store-msix.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -PackageVersion "${{ steps.version.outputs.msix_version }}"

      - name: Configure Microsoft Store credentials
        shell: pwsh
        run: |
          $tenantId = $env:PARTNER_CENTER_TENANT_ID.Trim().Trim([char]0xFEFF)
          $sellerId = $env:PARTNER_CENTER_SELLER_ID.Trim().Trim([char]0xFEFF)
          $clientId = $env:PARTNER_CENTER_CLIENT_ID.Trim().Trim([char]0xFEFF)
          $clientSecret = $env:PARTNER_CENTER_CLIENT_SECRET.Trim().Trim([char]0xFEFF)
          msstore reconfigure `
            --tenantId "$tenantId" `
            --sellerId "$sellerId" `
            --clientId "$clientId" `
            --clientSecret "$clientSecret"

      - name: Publish Microsoft Store listing text and screenshots
        shell: pwsh
        run: |
          ./packages/desktop/scripts/publish-store-listing.ps1 `
            -ListingPath packages/desktop/store-listing/listing.en-US.json

      - name: Publish MSIX to Microsoft Store
        shell: pwsh
        run: |
          $appId = $env:MICROSOFT_STORE_PRODUCT_ID.Trim().Trim([char]0xFEFF)
          msstore publish "." `
            --inputFile "${{ steps.package.outputs.msix }}" `
            --appId "$appId"

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.package.outputs.msix != '' }}
        with:
          name: paddie-store-msix-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.msix }}
