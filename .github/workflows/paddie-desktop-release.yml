name: paddie-desktop-release

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - stable
          - beta
          - dev
      version:
        description: "Desktop version, without leading v"
        required: true
        type: string

concurrency: paddie-desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
      should_release: ${{ steps.release_gate.outputs.should_release }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.ref }}
          fetch-depth: 0

      - name: Resolve release inputs
        id: release
        shell: pwsh
        run: |
          $channel = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.channel }}" } else { "stable" }
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            ((Get-Content -Raw -LiteralPath "packages/desktop/package.json" | ConvertFrom-Json).version -replace '[+-].*$', '')
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[.-].*)?$') {
            throw "Desktop release version '$version' must start with major.minor.patch"
          }
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release channel: $channel"
          Write-Host "Release version: $version"

      - name: Check release gate
        id: release_gate
        shell: pwsh
        run: |
          $shouldRelease = "true"
          if ("${{ github.event_name }}" -eq "push") {
            gh release view "v${{ steps.release.outputs.version }}" --repo $env:GITHUB_REPOSITORY *> $null
            $releaseExists = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0
            if ($releaseExists) {
              Write-Host "Stable release v${{ steps.release.outputs.version }} already exists. Skipping automatic release for this dev push."
              $shouldRelease = "false"
            }
          }
          "should_release=$shouldRelease" >> $env:GITHUB_OUTPUT

      - uses: ./.github/actions/setup-bun
        if: steps.release_gate.outputs.should_release == 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.release_gate.outputs.should_release == 'true'
        with:
          targets: x86_64-pc-windows-msvc

      - uses: azure/login@v2
        if: steps.release_gate.outputs.should_release == 'true' && env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Validate updater signing secrets
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required"
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required"
          }

      - name: Set desktop version
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $packagePath = "packages/desktop/package.json"
          $package = Get-Content -Raw -LiteralPath $packagePath | ConvertFrom-Json
          $package.version = "${{ steps.release.outputs.version }}"
          $package | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $packagePath

          $cargoPath = "packages/desktop/src-tauri/Cargo.toml"
          $cargo = Get-Content -Raw -LiteralPath $cargoPath
          $cargo = $cargo -replace '(?m)^version = "[^"]+"', 'version = "${{ steps.release.outputs.version }}"'
          Set-Content -LiteralPath $cargoPath -Value $cargo

          Push-Location packages/desktop/src-tauri
          cargo update -p opencode-desktop
          Pop-Location

      - name: Reinstall dependencies for Bun compile
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath packages -Directory | ForEach-Object {
            Remove-Item -Recurse -Force (Join-Path $_.FullName "node_modules") -ErrorAction SilentlyContinue
          }
          bun install

      - name: Build sidecar CLI
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        env:
          OPENCODE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          bun ./packages/opencode/script/build.ts --single --baseline
          New-Item -ItemType Directory -Force -Path packages/desktop/src-tauri/sidecars | Out-Null
          $binary = Get-ChildItem -LiteralPath packages/opencode/dist -Recurse -Filter opencode.exe |
            Where-Object { $_.FullName -match "opencode-windows-x64" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $binary) {
            throw "No Windows opencode.exe sidecar was produced"
          }
          Copy-Item `
            -LiteralPath $binary.FullName `
            -Destination packages/desktop/src-tauri/sidecars/opencode-cli-x86_64-pc-windows-msvc.exe `
            -Force

      - name: Build Tauri installer
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        env:
          OPENCODE_VERSION: ${{ steps.release.outputs.version }}
          RUST_TARGET: x86_64-pc-windows-msvc
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: |
          $channel = "${{ steps.release.outputs.channel }}"
          $env:OPENCODE_CHANNEL = if ($channel -eq "beta") { "beta" } elseif ($channel -eq "dev") { "dev" } else { "prod" }
          $env:VITE_OPENCODE_CHANNEL = $env:OPENCODE_CHANNEL
          $config = if ($channel -eq "beta") { "src-tauri/tauri.beta.conf.json" } elseif ($channel -eq "dev") { "src-tauri/tauri.conf.json" } else { "src-tauri/tauri.prod.conf.json" }
          bun run --cwd packages/desktop tauri build --target x86_64-pc-windows-msvc --bundles nsis --config $config

      - name: Prepare release assets
        if: steps.release_gate.outputs.should_release == 'true'
        id: assets
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $channel = "${{ steps.release.outputs.channel }}"
          $isBeta = $channel -eq "beta"
          $isDev = $channel -eq "dev"
          $bundleDir = "packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $exe = Get-ChildItem -LiteralPath $bundleDir -Filter "*setup.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) {
            throw "No NSIS installer found in $bundleDir"
          }

          $signature = Get-ChildItem -LiteralPath $bundleDir -Filter "*.sig" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $signature) {
            throw "No Tauri updater signature found in $bundleDir"
          }

          $releaseDir = Join-Path $env:RUNNER_TEMP "paddie-desktop-release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $assetName = if ($isBeta) {
            "PaddieStudioBeta_${version}_x64-setup.exe"
          } elseif ($isDev) {
            "PaddieStudioDev_${version}_x64-setup.exe"
          } else {
            "PaddieStudio_${version}_x64-setup.exe"
          }
          $assetPath = Join-Path $releaseDir $assetName
          $signaturePath = Join-Path $releaseDir "$assetName.sig"
          $manifestPath = Join-Path $releaseDir "latest.json"
          Copy-Item -LiteralPath $exe.FullName -Destination $assetPath -Force
          Copy-Item -LiteralPath $signature.FullName -Destination $signaturePath -Force

          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/$assetName"
          $entry = [ordered]@{
            signature = (Get-Content -Raw -LiteralPath $signature.FullName).Trim()
            url = $url
          }
          [ordered]@{
            version = $version
            notes = "Paddie Studio $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = $entry
              "windows-x86_64-nsis" = $entry
            }
          } | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $manifestPath

          "asset=$assetPath" >> $env:GITHUB_OUTPUT
          "signature=$signaturePath" >> $env:GITHUB_OUTPUT
          "manifest=$manifestPath" >> $env:GITHUB_OUTPUT
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        if: steps.release_gate.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $channel = "${{ steps.release.outputs.channel }}"
          $tag = "v$version"
          $target = (git rev-parse HEAD).Trim()
          $isBeta = $channel -eq "beta"
          $isDev = $channel -eq "dev"
          $title = if ($isBeta) { "Paddie Studio $version Beta" } elseif ($isDev) { "Paddie Studio $version Dev" } else { "Paddie Studio $version" }
          $notes = @"
          ## Desktop
          - Windows installer built by GitHub Actions.
          - Tauri updater manifest and signature included.
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            $releaseArgs = @("release", "create", $tag, "--repo", $env:GITHUB_REPOSITORY, "--target", $target, "--title", $title, "--notes", $notes)
            if ($isBeta -or $isDev) {
              $releaseArgs += "--prerelease"
            }
            gh @releaseArgs
          }

          gh release upload $tag `
            "${{ steps.assets.outputs.asset }}" `
            "${{ steps.assets.outputs.signature }}" `
            "${{ steps.assets.outputs.manifest }}" `
            --clobber `
            --repo $env:GITHUB_REPOSITORY

          if ($isBeta -or $isDev) {
            $rollingTag = if ($isBeta) { "beta" } else { "dev" }
            $rollingTitle = if ($isBeta) { "Paddie Studio Beta Channel" } else { "Paddie Studio Dev Channel" }
            $rollingNotes = if ($isBeta) { "Rolling beta update manifest." } else { "Rolling dev update manifest." }

            git tag -f $rollingTag $target
            git push origin "refs/tags/$rollingTag" --force

            gh release view $rollingTag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release create $rollingTag --repo $env:GITHUB_REPOSITORY --target $target --title $rollingTitle --notes $rollingNotes --prerelease
            }

            gh release upload $rollingTag "${{ steps.assets.outputs.manifest }}" --clobber --repo $env:GITHUB_REPOSITORY
          }

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.assets.outputs.asset != '' }}
        with:
          name: paddie-desktop-${{ steps.release.outputs.channel }}-${{ steps.release.outputs.version }}
          path: |
            ${{ steps.assets.outputs.asset }}
            ${{ steps.assets.outputs.signature }}
            ${{ steps.assets.outputs.manifest }}

  linux:
    needs: windows
    if: needs.windows.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm
          sudo apt-get install -y --no-install-recommends libfuse2t64 || sudo apt-get install -y --no-install-recommends libfuse2

      - name: Validate updater signing secrets
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is required"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required"; exit 1; }

      - name: Set desktop version
        run: |
          node - <<'NODE'
          const fs = require("fs")
          const packagePath = "packages/desktop/package.json"
          const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"))
          pkg.version = "${{ needs.windows.outputs.version }}"
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + "\n")

          const cargoPath = "packages/desktop/src-tauri/Cargo.toml"
          fs.writeFileSync(
            cargoPath,
            fs.readFileSync(cargoPath, "utf8").replace(/^version = "[^"]+"/m, 'version = "${{ needs.windows.outputs.version }}"'),
          )
          NODE
          cargo update -p opencode-desktop --manifest-path packages/desktop/src-tauri/Cargo.toml

      - name: Build sidecar CLI
        env:
          OPENCODE_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          bun ./packages/opencode/script/build.ts --single --baseline
          mkdir -p packages/desktop/src-tauri/sidecars
          cp \
            packages/opencode/dist/opencode-linux-x64-baseline/bin/opencode \
            packages/desktop/src-tauri/sidecars/opencode-cli-x86_64-unknown-linux-gnu
          chmod +x packages/desktop/src-tauri/sidecars/opencode-cli-x86_64-unknown-linux-gnu

      - name: Build Linux bundles
        env:
          OPENCODE_VERSION: ${{ needs.windows.outputs.version }}
          OPENCODE_CHANNEL: prod
          VITE_OPENCODE_CHANNEL: prod
          RUST_TARGET: x86_64-unknown-linux-gnu
          TAURI_ENV_TARGET_TRIPLE: x86_64-unknown-linux-gnu
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          bun run --cwd packages/desktop tauri build \
            --target x86_64-unknown-linux-gnu \
            --bundles deb,rpm,appimage \
            --config src-tauri/tauri.prod.conf.json

      - name: Upload Linux release assets
        id: linux_assets
        run: |
          version="${{ needs.windows.outputs.version }}"
          release_dir="$RUNNER_TEMP/paddie-desktop-linux-release"
          mkdir -p "$release_dir"

          deb="$(find packages/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -name '*.deb' -type f | head -1)"
          rpm="$(find packages/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm -name '*.rpm' -type f | head -1)"
          appimage="$(find packages/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -name '*.AppImage' -type f | head -1)"
          appimage_sig="$(find packages/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -name '*.AppImage.sig' -type f | head -1)"
          test -n "$deb" || { echo "No .deb bundle found"; exit 1; }
          test -n "$rpm" || { echo "No .rpm bundle found"; exit 1; }
          test -n "$appimage" || { echo "No AppImage bundle found"; exit 1; }

          deb_asset="$release_dir/PaddieStudio_${version}_linux_x64.deb"
          rpm_asset="$release_dir/PaddieStudio_${version}_linux_x64.rpm"
          appimage_asset="$release_dir/PaddieStudio_${version}_linux_x64.AppImage"
          tarball_asset="$release_dir/PaddieStudio_${version}_linux_x64.tar.gz"
          bundle_root="$release_dir/PaddieStudio_${version}_linux_x64"
          cp "$deb" "$deb_asset"
          cp "$rpm" "$rpm_asset"
          cp "$appimage" "$appimage_asset"
          mkdir -p "$bundle_root"
          dpkg-deb -x "$deb" "$bundle_root"
          entry="$(find "$bundle_root/usr/bin" -type f | head -1)"
          test -n "$entry" || { echo "No Linux executable found in extracted bundle"; exit 1; }
          entry_rel="${entry#$bundle_root/}"
          cat > "$bundle_root/run-paddie-studio.sh" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          cd "\$(dirname "\$0")"
          exec "./$entry_rel" "\$@"
          EOF
          chmod +x "$bundle_root/run-paddie-studio.sh"
          tar -C "$release_dir" -czf "$tarball_asset" "$(basename "$bundle_root")"

          upload_assets=("$deb_asset" "$rpm_asset" "$appimage_asset" "$tarball_asset")
          if [ -n "$appimage_sig" ]; then
            appimage_sig_asset="$release_dir/PaddieStudio_${version}_linux_x64.AppImage.sig"
            cp "$appimage_sig" "$appimage_sig_asset"
            upload_assets+=("$appimage_sig_asset")
            echo "appimage_sig=$appimage_sig_asset" >> "$GITHUB_OUTPUT"
          fi

          gh release upload "v$version" "${upload_assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"

          echo "deb=$deb_asset" >> "$GITHUB_OUTPUT"
          echo "rpm=$rpm_asset" >> "$GITHUB_OUTPUT"
          echo "appimage=$appimage_asset" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball_asset" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.linux_assets.outputs.deb != '' }}
        with:
          name: paddie-desktop-linux-${{ needs.windows.outputs.version }}
          path: |
            ${{ steps.linux_assets.outputs.deb }}
            ${{ steps.linux_assets.outputs.rpm }}
            ${{ steps.linux_assets.outputs.appimage }}
            ${{ steps.linux_assets.outputs.appimage_sig }}
            ${{ steps.linux_assets.outputs.tarball }}
