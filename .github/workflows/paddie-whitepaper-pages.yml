name: paddie-whitepaper-pages

on:
  push:
    branches:
      - dev
    paths:
      - "pages/paddie-whitepaper/**"
      - ".github/workflows/paddie-whitepaper-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: paddie-whitepaper-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages/paddie-whitepaper

      - id: deployment
        uses: actions/deploy-pages@v4
